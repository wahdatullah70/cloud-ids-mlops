name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reproducible demo
        run: python src/fusion_demo.py examples/events.json > /tmp/fusion-output.json
      - name: Validate JSON output
        run: python -m json.tool /tmp/fusion-output.json >/dev/null
